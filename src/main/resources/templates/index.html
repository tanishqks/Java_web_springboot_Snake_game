<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Java Spring Boot</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: min(700px, 94vw);
            text-align: center;
        }

        h1 {
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .hidden { display: none; }

        .start-screen {
            padding: 40px 20px;
        }

        input {
            display: block;
            margin: 12px auto;
            width: 260px;
            padding: 12px;
            background: #222;
            color: white;
            border: 2px solid #555;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
        }

        button {
            padding: 13px 42px;
            margin-top: 18px;
            border: 2px solid #725500;
            border-radius: 9px;
            background: linear-gradient(#d8ad2b, #9b7205);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #5a4200, 0 8px 12px rgba(0,0,0,.4);
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #5a4200;
        }

        .stats {
            width: min(600px, 94vw);
            margin: 0 auto 10px;
            display: flex;
            justify-content: space-between;
        }

        canvas {
            width: min(600px, 94vw);
            height: auto;
            aspect-ratio: 1 / 1;
            background: #191919;
            border: 3px solid #555;
            border-radius: 6px;
        }

        .controls {
            color: #aaa;
            margin: 12px;
        }

        #restart {
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">

    <div id="startScreen" class="start-screen">
        <h1>SNAKE GAME</h1>
        <p>Enter your snake's name:</p>
        <input id="snakeName" type="text" placeholder="Bongo" maxlength="15">
        <button onclick="startGame()">START</button>
    </div>

    <div id="gameScreen" class="hidden">
        <h1 id="gameTitle">The food is waiting for you!</h1>

        <div class="stats">
            <span>Score: <b id="score">0</b></span>
            <span>Snake: <b id="name">Bongo</b></span>
        </div>

        <canvas id="board" width="600" height="600"></canvas>

        <p class="controls">Use ↑ ↓ ← → arrow keys to move</p>
        <button id="restart" onclick="restartGame()">RESTART</button>
    </div>

</div>

<script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");

    const GRID = 20;
    const CELL = canvas.width / GRID;

    let snake = [];
    let food = {};
    let direction = {x: 1, y: 0};
    let nextDirection = {x: 1, y: 0};
    let score = 0;
    let playerName = "Bongo";
    let timer = null;
    let running = false;

    function startGame() {
        playerName = document.getElementById("snakeName").value.trim() || "Bongo";

        document.getElementById("name").textContent = playerName;
        document.getElementById("gameTitle").textContent =
            "The food is waiting for you " + playerName + "!";

        document.getElementById("startScreen").classList.add("hidden");
        document.getElementById("gameScreen").classList.remove("hidden");

        restartGame();
    }

    function restartGame() {
        clearInterval(timer);

        snake = [
            {x: 10, y: 10},
            {x: 9, y: 10},
            {x: 8, y: 10}
        ];

        direction = {x: 1, y: 0};
        nextDirection = {x: 1, y: 0};
        score = 0;
        running = true;

        document.getElementById("score").textContent = score;

        createFood();
        draw();

        timer = setInterval(updateGame, 110);
    }

    function createFood() {
        do {
            food = {
                x: Math.floor(Math.random() * GRID),
                y: Math.floor(Math.random() * GRID)
            };
        } while (snake.some(part => part.x === food.x && part.y === food.y));
    }

    function updateGame() {
        if (!running) return;

        direction = nextDirection;

        const head = {
            x: snake[0].x + direction.x,
            y: snake[0].y + direction.y
        };

        if (head.x < 0 || head.x >= GRID ||
            head.y < 0 || head.y >= GRID) {
            gameOver();
            return;
        }

        if (snake.some(part => part.x === head.x && part.y === head.y)) {
            gameOver();
            return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score++;
            document.getElementById("score").textContent = score;
            createFood();
        } else {
            snake.pop();
        }

        draw();
    }

    function draw() {
        ctx.fillStyle = "#191919";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawFood();

        snake.forEach((part, index) => {
            const p = 2;

            ctx.fillStyle = index === 0 ? "#e1b52d" : "#c49416";
            ctx.fillRect(
                part.x * CELL + p,
                part.y * CELL + p,
                CELL - p * 2,
                CELL - p * 2
            );
        });
    }

    function drawFood() {
        ctx.fillStyle = "#e85d5d";
        ctx.beginPath();
        ctx.arc(
            food.x * CELL + CELL / 2,
            food.y * CELL + CELL / 2,
            CELL * .32,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }

    function gameOver() {
        running = false;
        clearInterval(timer);

        setTimeout(() => {
            alert("Game Over, " + playerName + "! Your score is " + score + ".");
        }, 50);
    }

    document.addEventListener("keydown", function(event) {
        const keys = {
            ArrowUp: {x: 0, y: -1},
            ArrowDown: {x: 0, y: 1},
            ArrowLeft: {x: -1, y: 0},
            ArrowRight: {x: 1, y: 0}
        };

        if (!keys[event.key]) return;

        event.preventDefault();

        const newDirection = keys[event.key];

        if (newDirection.x + direction.x === 0 &&
            newDirection.y + direction.y === 0) {
            return;
        }

        nextDirection = newDirection;
    });
</script>

</body>
</html>
